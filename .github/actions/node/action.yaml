name: 'Setup Node'
description: 'This action installs Node and pnpm with mise, and caches the pnpm store'
inputs:
  tools:
    description: Space-separated mise tools to install in addition to Node and pnpm.
    default: ''
    required: false

runs:
  using: composite
  steps:
    - uses: ./.github/actions/mise
      with:
        tools: node pnpm ${{ inputs.tools }}

    - name: Find pnpm store directory
      id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-store-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-store-${{ runner.os }}-${{ runner.arch }}-
