---
name: go-linter
description: This action validates the codebase using static analysis tools
inputs:
  working-directory:
    description: The working directory to run the linter in
    required: true

runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: ~/.cache/golangci-lint
        key: golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-${{ hashFiles(format('{0}/go.sum', inputs.working-directory)) }}
        restore-keys: |
          golangci-lint-${{ runner.os }}-${{ runner.arch }}-${{ inputs.working-directory }}-

    - name: Run golangci-lint
      run: |
        echo "::add-matcher::$GITHUB_ACTION_PATH/problem-matcher.json"
        golangci-lint run --path-mode=abs --output.text.colors=false
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check gofmt formatting
      run: |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "The following files are not gofmt-formatted:"
          echo "$files"
          exit 1
        fi
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check go fix
      run: go fix -diff ./...
      shell: bash
      working-directory: ${{ inputs.working-directory }}
