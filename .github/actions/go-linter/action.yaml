---
name: go-linter
description: This action validates the codebase using static analysis tools
inputs:
  working-directory:
    description: The working directory to run the linter in
    required: true

runs:
  using: composite
  steps:
    - name: Read golangci-lint version
      id: golangci-lint-version
      run: echo "version=$(cat .golangci-lint-version)" >> "$GITHUB_OUTPUT"
      shell: bash
      working-directory: ${{ github.workspace }}

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
      with:
        version: ${{ steps.golangci-lint-version.outputs.version }}
        working-directory: ${{ inputs.working-directory }}

    - name: Check gofmt formatting
      run: |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "The following files are not gofmt-formatted:"
          echo "$files"
          exit 1
        fi
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check go fix
      run: go fix -diff ./...
      shell: bash
      working-directory: ${{ inputs.working-directory }}
