---
name: go-linter
description: This action validates the codebase using static analysis tools
inputs:
  working-directory:
    description: The working directory to run the linter in
    required: true

runs:
  using: composite
  steps:
    # Install through the wrapper so CI uses the same checksum-verified binary as local runs.
    - name: Install golangci-lint
      run: |
        ./scripts/golangci-lint.sh version
        mkdir -p "$RUNNER_TEMP/golangci-lint"
        ln -sf "$PWD/.bin/golangci-lint-$(cut -d : -f 1 .golangci-lint-version)" "$RUNNER_TEMP/golangci-lint/golangci-lint"
        echo "$RUNNER_TEMP/golangci-lint" >> "$GITHUB_PATH"
      shell: bash
      working-directory: ${{ github.workspace }}

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
      with:
        install-mode: none
        working-directory: ${{ inputs.working-directory }}
        args: --timeout=3m

    - name: Run staticcheck linter
      uses: dominikh/staticcheck-action@v1.3.1
      with:
        version: 2026.2.1
        install-go: false
        working-directory: ${{ inputs.working-directory }}

    - name: Check gofmt formatting
      run: |
        files=$(gofmt -l .)
        if [ -n "$files" ]; then
          echo "The following files are not gofmt-formatted:"
          echo "$files"
          exit 1
        fi
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check go fix
      run: go fix -diff ./...
      shell: bash
      working-directory: ${{ inputs.working-directory }}
