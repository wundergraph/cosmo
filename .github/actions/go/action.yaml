name: 'Setup Go'
description: 'This action installs Go and the tools from mise.toml, and caches modules and build dependencies'
inputs:
  working-directory:
    description: 'The directory whose mise tools are installed'
    default: '.'
    required: false
  cache-dependency-path:
    description: 'The path to the dependency to cache'
    default: '**/go.sum'
    required: false

runs:
  using: 'composite'
  steps:
    - uses: ./.github/actions/mise
      with:
        working-directory: ${{ inputs.working-directory }}

    - name: Find Go cache directories
      id: go-env
      run: |
        echo "modcache=$(go env GOMODCACHE)" >> "$GITHUB_OUTPUT"
        echo "cache=$(go env GOCACHE)" >> "$GITHUB_OUTPUT"
        echo "version=$(go env GOVERSION)" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@v4
      with:
        path: |
          ${{ steps.go-env.outputs.modcache }}
          ${{ steps.go-env.outputs.cache }}
        key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-env.outputs.version }}-${{ hashFiles(inputs.cache-dependency-path) }}
