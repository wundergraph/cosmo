name: Deploy

on:
  # Fires only when a stable (non-prerelease) release is published. The release
  # is created by the "Release" workflow using a GitHub App token, which — unlike
  # the default GITHUB_TOKEN — emits release events that trigger this workflow.
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Production-Deploy
  cancel-in-progress: false

env:
  CI: true
  DO_NOT_TRACK: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read versions
        id: versions
        run: |
          CP_VERSION=$(node -p "require('./controlplane/package.json').version")
          STUDIO_VERSION=$(node -p "require('./studio/package.json').version")
          echo "controlplane=${CP_VERSION}" >> $GITHUB_OUTPUT
          echo "studio=${STUDIO_VERSION}" >> $GITHUB_OUTPUT

      - name: Authenticate
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            cosmo-cloud
          permission-contents: write

      - name: Trigger Deployment Repo Dispatch
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: wundergraph/cosmo-cloud
          event-type: cosmo
          client-payload: |-
            {
              "controlplane_version": ${{ toJSON(steps.versions.outputs.controlplane) }},
              "studio_version": ${{ toJSON(steps.versions.outputs.studio) }},
              "triggered_by": ${{ toJSON(format('{0} <{1}+{2}@users.noreply.github.com>', github.actor, github.actor_id, github.actor)) }}
            }
