name: Deploy

on:
  # Fires only when a stable (non-prerelease) release is published. The release
  # is created by the "Release" workflow using a GitHub App token, which — unlike
  # the default GITHUB_TOKEN — emits release events that trigger this workflow.
  release:
    types: [released]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: Production-Deploy
  cancel-in-progress: false

env:
  CI: true
  DO_NOT_TRACK: '1'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read versions
        id: versions
        run: |
          CP_VERSION=$(node -p "require('./controlplane/package.json').version")
          STUDIO_VERSION=$(node -p "require('./studio/package.json').version")
          echo "controlplane=${CP_VERSION}" >> $GITHUB_OUTPUT
          echo "studio=${STUDIO_VERSION}" >> $GITHUB_OUTPUT

      - name: Authenticate
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            cosmo-cloud
          permission-contents: write

      - name: Trigger Deployment Repo Dispatch
        shell: bash
        run: |
          cat >body.json <<EOT
            {
              "event_type": "cosmo",
              "client_payload": {
                "controlplane_version": "${{ steps.versions.outputs.controlplane }}",
                "studio_version": "${{ steps.versions.outputs.studio }}",
                "triggered_by": "${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>"
              }
            }
          EOT
          echo "[DEBUG] Will send body:\n$(cat body.json)\n[DEBUG] End body"
          curl -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ steps.app-token.outputs.token }}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            -d "@body.json" \
            https://api.github.com/repos/wundergraph/cosmo-cloud/dispatches
