name: Helm CI
on:
  pull_request:
    paths:
      - "helm/**/*"
      - ".github/workflows/helm-ci.yaml"
      - "mise.toml"
      - "mise.lock"
      - ".github/actions/mise/**"

concurrency:
  group: ${{github.workflow}}-${{github.head_ref}}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/mise
        with:
          working-directory: helm
          tools: helm-docs

      - name: Generate Helm docs
        run: make docs
        working-directory: ./helm

      - name: Check if git is not dirty after generating files
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release-please--')) || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--'))
        run: git diff --no-ext-diff --exit-code ./helm
