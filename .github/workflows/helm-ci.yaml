name: Helm CI
on:
  pull_request:
    paths:
      - "helm/**/*"
      - ".github/workflows/helm-ci.yaml"

concurrency:
  group: ${{github.workflow}}-${{github.head_ref}}
  cancel-in-progress: true

env:
  CI: true

jobs:
  build_test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/go

      - uses: azure/setup-helm@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.20'
          enable-cache: true
          cache-dependency-glob: helm/uv.lock

      - name: Test Helm charts
        run: make test-render
        working-directory: ./helm

      - name: Install tools
        run: go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.11.3

      - name: Generate Helm docs
        run: make docs
        working-directory: ./helm

      - name: Check if git is not dirty after generating files
        if: (github.event_name == 'push' && !startsWith(github.ref, 'refs/heads/release-please--')) || (github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--'))
        run: git diff --no-ext-diff --exit-code ./helm

  validate_cluster:
    name: Validate charts on kind
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4

      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.12.20'
          enable-cache: true
          cache-dependency-glob: helm/uv.lock

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.0
        with:
          version: v0.32.0
          kubectl_version: v1.36.1
          node_image: kindest/node:v1.36.1
          cluster_name: cosmo-helm-tests
          kubeconfig: ${{ runner.temp }}/cosmo-helm-tests.kubeconfig

      - name: Validate chart configurations
        run: make test-cluster
        working-directory: ./helm
        env:
          HELM_TEST_KUBECONFIG: ${{ runner.temp }}/cosmo-helm-tests.kubeconfig
