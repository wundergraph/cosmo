name: Build and Release Image
run-name: ${{ github.event_name == 'push' && format('Build router main image {0}', github.sha) || format('Build and Release {0} Image v{1}', inputs.name, inputs.tag) }}
on:
  # Every push to main publishes the router image as `main` and `main-<shortsha>`.
  # It never moves `latest`; only release dispatches do.
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      name:
        description: 'Name of the service to release'
        required: true
        type: choice
        options:
          - keycloak
          - otelcollector
          - cdn
          - controlplane
          - studio
          - graphqlmetrics
          - router
      tag:
        description: 'Tag to release'
        required: true
        type: string

      workingDirectory:
        description: 'Working directory to use'
        type: string
        required: true

      dockerContext:
        description: 'Docker context to use'
        type: string
        default: .

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  DO_NOT_TRACK: '1'
  # Pushes to main only build the router; dispatches use the given inputs.
  SERVICE_NAME: ${{ inputs.name || 'router' }}
  WORKING_DIRECTORY: ${{ inputs.workingDirectory || 'router' }}
  DOCKER_CONTEXT: ${{ inputs.dockerContext || 'router' }}
  IS_RELEASE: ${{ github.event_name == 'workflow_dispatch' }}

jobs:
  build-and-push-image:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        docker_build_target: ${{ (github.event_name == 'push' || inputs.name == 'router') && fromJson('["", "nonroot"]') || fromJson('[""]') }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Container registry
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          flavor: |
            suffix=${{ matrix.docker_build_target != '' && format('-{0}', matrix.docker_build_target) || '' }},onlatest=true
          # The router's `main` tag is moved only by the promote-main job below, never by a
          # release, so a release of an older commit cannot roll it back. Other services
          # have no push build and keep getting `main` from their releases.
          tags: |
            type=ref,event=branch,enable=${{ env.SERVICE_NAME != 'router' }}
            type=sha,enable=${{ env.IS_RELEASE }}
            # set latest tag for default branch, only on releases
            type=raw,value=latest,enable=${{ env.IS_RELEASE == 'true' && github.ref_name == github.event.repository.default_branch }}
            # use custom value instead of git tag
            type=raw,value=${{ inputs.tag }},enable=${{ env.IS_RELEASE }}
            # main-<shortsha>, only on pushes to main
            type=sha,prefix=main-,enable=${{ env.IS_RELEASE != 'true' }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Summary
        run: echo -e "# ${{ env.SERVICE_NAME }}\n## Tags\n\`\`\`${{ steps.meta.outputs.tags }}\n\`\`\`\n## Labels\n\`\`\`${{ steps.meta.outputs.labels }}\n\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Set BUILD_TIME env
        run: echo BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ') >> ${GITHUB_ENV}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          push: true
          file: ${{ env.WORKING_DIRECTORY }}/Dockerfile
          context: ${{ env.DOCKER_CONTEXT }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}:buildcache,mode=max
          platforms: linux/amd64,linux/arm64
          target: ${{ matrix.docker_build_target }}
          outputs:
            type=image,name=target,annotation-index.org.opencontainers.image.description=${{ env.SERVICE_NAME }}
            type=image,name=target,annotation-index.org.opencontainers.image.source=https://github.com/wundergraph/cosmo
            type=image,name=target,annotation-index.org.opencontainers.image.licenses=Apache-2.0
          build-args: |
            VERSION=${{ inputs.tag || format('main-{0}', github.sha) }}
            DATE=${{ env.BUILD_TIME }}
            COMMIT=${{ github.sha }}

  # Moves the router's `main` tag after a push to main. The build job above has no
  # concurrency group, so every push publishes its own `main-<shortsha>`. This job is
  # serialized per service and never cancelled, but GitHub may replace a pending run
  # with a newer one. To stay correct when that happens, each run promotes the newest
  # commit on main whose images are all published, and only if it is newer than the
  # commit `main` already points to. So `main` never moves to an older commit.
  promote-main:
    if: github.event_name == 'push'
    needs: build-and-push-image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: ${{ github.workflow }}-promote-main-router
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: tree:0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Github Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote newest built commit to main
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          OWN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          suffixes=("" "-nonroot")

          # Commit that `main` points to now, from the OCI revision label.
          current=""
          if docker buildx imagetools inspect "$IMAGE:main" > /dev/null 2>&1; then
            current=$(docker buildx imagetools inspect "$IMAGE:main" --format '{{json .Image}}' \
              | jq -r 'if has("config") then .config.Labels else (to_entries[0].value.config.Labels) end
                       | .["org.opencontainers.image.revision"] // ""')
          fi
          echo "main currently points to: ${current:-<none>}"

          # Walk main from its head back to this run's commit, newest first.
          found=false
          for commit in $(git rev-list --first-parent --max-count=200 HEAD); do
            if [ "$commit" = "$current" ]; then
              echo "main already points to the newest built commit"
              exit 0
            fi
            short="${commit:0:7}"
            complete=true
            for suffix in "${suffixes[@]}"; do
              if ! docker buildx imagetools inspect "$IMAGE:main-$short$suffix" > /dev/null 2>&1; then
                complete=false
                break
              fi
            done
            if [ "$complete" = true ]; then
              found=true
              break
            fi
            if [ "$commit" = "$OWN_SHA" ]; then
              break
            fi
          done

          if [ "$found" != true ]; then
            echo "::warning::No complete main-<shortsha> image found between main and $OWN_SHA"
            exit 0
          fi

          if [ -n "$current" ]; then
            if ! git cat-file -e "$current^{commit}" 2> /dev/null; then
              echo "::warning::main points to unknown commit $current, replacing it"
            elif ! git merge-base --is-ancestor "$current" "$commit"; then
              echo "main points to $current, which is not older than $commit; leaving it"
              exit 0
            fi
          fi

          echo "Promoting main-$short to main"
          for suffix in "${suffixes[@]}"; do
            docker buildx imagetools create \
              --annotation "index:org.opencontainers.image.description=$SERVICE_NAME" \
              --annotation "index:org.opencontainers.image.source=https://github.com/wundergraph/cosmo" \
              --annotation "index:org.opencontainers.image.licenses=Apache-2.0" \
              --tag "$IMAGE:main$suffix" "$IMAGE:main-$short$suffix"
          done
          echo -e "# router\nmain -> main-$short ($commit)" >> "$GITHUB_STEP_SUMMARY"
