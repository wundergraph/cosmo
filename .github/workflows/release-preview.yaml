name: Release Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
  push:
    tags-ignore:
      - '**'
    branches:
      - 'main'
    paths-ignore:
      - 'docs*/**'
      - '*.md'
      - '.github/CODEOWNERS'

concurrency:
  group: ${{github.workflow}}-${{github.head_ref}}
  cancel-in-progress: false

env:
  CI: true
  DO_NOT_TRACK: '1'

jobs:
  pull-request-preview:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # Preview the squash commit that will land on main, including ! in the title.
      - name: Simulate squash merge
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          git checkout -b release-preview
          git reset --soft "$BASE_SHA"
          git -c user.name='Release Preview' -c user.email='release-preview@localhost' \
            -c core.hooksPath=/dev/null commit --allow-empty -m "$PR_TITLE" -m "$PR_BODY"

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          cache: true
          install: false

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts --filter='wundergraph-cosmo'

      - name: Generate next release (dry-run)
        run: pnpm lerna version --ignore-scripts --dry-run --yes --no-push --no-git-tag-version
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Show release preview
        run: |
          {
            echo '## Release preview'
            echo 'Versions and changelogs after squash-merging this PR, including unreleased changes already on main.'
            echo '```diff'
            git --no-pager diff -- './*/package.json' './*/CHANGELOG.md'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  version:
    if: github.event_name == 'push'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          repositories: |
            cosmo
          permission-actions: write
          permission-contents: write
          permission-workflows: write

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2
        with:
          cache: true
          install: false

      - run: npm config set //registry.npmjs.org/:_authToken $NPM_TOKEN
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install
        run: pnpm install --frozen-lockfile --filter='wundergraph-cosmo'

      - name: Generate next release (dry-run)
        run: pnpm run release-preview --yes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show CHANGELOG.md
        run: echo -e "\`\`\`diff\n$(git --no-pager diff './*/CHANGELOG.md')\n\`\`\`" >> $GITHUB_STEP_SUMMARY
