name: 'Relay customer issues and PRs to Pylon'
on:
  issues:
    types: [opened]
  # Lets fork PRs read the secret. Never check out the PR head.
  pull_request_target:
    types: [opened]

jobs:
  relay:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Create Pylon issue for customer authors
        uses: actions/github-script@v7
        env:
          PYLON_API_TOKEN: ${{ secrets.PYLON_API_TOKEN }}
        with:
          script: |
            const relay = require('./.github/scripts/pylon.js');
            await relay({ github, context, core });
