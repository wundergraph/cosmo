name: Build and Release AWS Router Binaries
on:
  release:
    types: [published]
  #workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  releases-matrix:
    if: startsWith(github.event.release.tag_name, 'aws-lambda-router@')
    name: Build and Release AWS Router Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Keep the module cache inside the workspace so the containerized release
    # action can reuse the modules that the host downloads below.
    env:
      GOMODCACHE: ${{ github.workspace }}/.gomodcache

    strategy:
      matrix:
        # build and publish in parallel: linux/386, linux/amd64, linux/arm64, darwin/amd64, darwin/arm64
        goos: [linux, darwin]
        goarch: ["386", amd64, arm64]
        exclude:
          - goarch: "386"
            goos: darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/go
        with:
          cache-dependency-path: aws-lambda-router/go.sum

      - name: Download Go modules
        working-directory: aws-lambda-router
        run: |
          for attempt in 1 2 3; do
            timeout --kill-after=5s 120s go mod download && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - uses: winterjung/split@v2
        id: split
        with:
          separator: "@"
          msg: "${{ github.event.release.tag_name }}"

      - name: Set BUILD_TIME env
        run: echo BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ') >> ${GITHUB_ENV}

      - uses: wangyoucao577/go-release-action@v1
        name: Build and attach binaries to GitHub Release
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          goos: ${{ matrix.goos }}
          goarch: ${{ matrix.goarch }}
          # Where to run `go build .`
          project_path: "aws-lambda-router/cmd"
          # Convention from AWS Lambda
          binary_name: "bootstrap"
          # The action evals this unquoted, so keep it on one line. The container
          # sees the workspace at /github/workspace.
          pre_command: export CGO_ENABLED=0 GOMODCACHE=/github/workspace/.gomodcache
          build_flags: -trimpath
          # -w = omits the DWARF symbol table, effectively removing debugging information. Reduces binary size by ~30%.
          ldflags: -w -extldflags -static -X "github.com/wundergraph/cosmo/aws-lambda-router/internal.Version=${{ steps.split.outputs._1 }}" -X "github.com/wundergraph/cosmo/aws-lambda-router/internal.Date=${{ env.BUILD_TIME }}" -X "github.com/wundergraph/cosmo/aws-lambda-router/internal.Commit=${{ github.sha }}"
          overwrite: true
          extra_files: LICENSE
          #release_tag: aws-lambda-router@0.1.0