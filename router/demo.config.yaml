# yaml-language-server: $schema=./pkg/config/config.schema.json

# See pkg/config/config.go for the full list of configuration options.
# This file is used for the demo environment

version: "1"

events:
  providers:
    nats:
      - id: default
        url: "nats://localhost:4222"
      - id: my-nats
        url: "nats://localhost:4222"
    kafka:
      - id: my-kafka
        brokers:
          - "localhost:9092"
    redis:
      - id: my-redis
        urls:
          - "redis://localhost:6379/2"
  delivery_guarantees:
    cursor_resume:
      identity_claim: sub
      # Demo-only secrets. Use secrets of at least 32 bytes from your secret store in production,
      # e.g. secret: "${COSMO_CURSOR_KEY_1}".
      keys:
        - id: 1
          secret: "demo-cursor-signing-key-1-0123456789"
          # Stops signing new cursors after this point, but keeps verifying them.
          expires_at: 2027-01-01T00:00:00Z
        - id: 2
          secret: "demo-cursor-signing-key-2-0123456789"
