schema @link(url: "https://example.com/translate/v1.0", import: ["@translate"]) @composeDirective(name: "@translate") {
  query: Query
}

directive @translate(language: String!) on FIELD_DEFINITION

type Query {
  greeting: String! @translate(language: "es") @tag(name: "internal")
  farewell: String! @translate(language: "es")
  unsupportedLanguage: String! @translate(language: "xx")
  card: Card!
}

type Card {
  greeting: String!
  caption: String! @translate(language: "es")
}
