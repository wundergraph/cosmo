schema @link(url: "https://example.com/translate/v1.0", import: ["@translate"]) @composeDirective(name: "@translate") {
  query: Query
}

directive @translate(from: String!, to: String!) on FIELD_DEFINITION

type Query {
  greeting: String! @translate(from: "hello world", to: "Hola mundo") @tag(name: "internal")
  card: Card!
}

type Card {
  greeting: String!
  caption: String! @translate(from: "hello world", to: "Hola mundo")
}
