receivers:
  otlp:
    protocols:
      grpc:
        endpoint: '0.0.0.0:4317'
        auth:
          authenticator: jwtauthextension
      http:
        endpoint: '0.0.0.0:4318'
        auth:
          authenticator: jwtauthextension

processors:
  attributes/from_auth_context:
    actions:
      - key: wg.organization.id
        from_context: auth.organization_id
        action: insert
      - key: wg.federated_graph.id
        from_context: auth.federated_graph_id
        action: insert
  attributes/delete_operation_bodies:
    actions:
      - key: wg.operation.normalized_content
        action: delete
      - key: wg.operation.original_content
        action: delete
  batch:
    send_batch_size: 10000
    send_batch_max_size: 20000
    timeout: 15s

exporters:
  clickhouse:
    endpoint: ${env:CLICKHOUSE_ENDPOINT}
    timeout: 10s
    database: cosmo
    # The exporter creates these tables. The ClickHouse migrations in controlplane/clickhouse
    # read from them, so keep the names in sync.
    traces_table_name: otel_traces
    metrics_tables:
      gauge:
        name: otel_metrics_gauge
      sum:
        name: otel_metrics_sum
      summary:
        name: otel_metrics_summary
      histogram:
        name: otel_metrics_histogram
      exponential_histogram:
        name: otel_metrics_exponential_histogram
    ttl: 720h
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

extensions:
  health_check:
    path: /health
    endpoint: 0.0.0.0:13133
  jwtauthextension:
    secret: ${env:OTEL_INGEST_JWT_SECRET}

service:
  extensions: [health_check, jwtauthextension]
  pipelines:
    metrics:
      receivers: [otlp]
      # Order is important here. Otherwise, the attributes processor will not be able to read the attributes from the auth context.
      processors: [attributes/from_auth_context, batch]
      exporters: [clickhouse]
    traces:
      receivers: [otlp]
      # Order is important here. Otherwise, the attributes processor will not be able to read the attributes from the auth context.
      processors: [attributes/from_auth_context, attributes/delete_operation_bodies, batch]
      exporters: [clickhouse]
  telemetry:
    metrics:
      level: ${env:PROMETHEUS_LEVEL:-none}
      readers:
        - pull:
            exporter:
              prometheus:
                host: ${env:PROMETHEUS_HOST:-127.0.0.1}
                port: ${env:PROMETHEUS_PORT:-8088}
    logs:
      level: INFO
      encoding: json
      # https://opentelemetry.io/docs/collector/internal-telemetry/#configure-internal-logs
      # https://github.com/open-telemetry/opentelemetry-collector/issues/3460#issuecomment-1981097777
      # output logging to stdout
      output_paths: ['stdout']
      error_output_paths: ['stderr']
